# syncraft on digital-lab.tek.sdu.dk:
#   /syncraft/        static project page (site/, served from the checkout)
#   /syncraft/demo/   Streamlit demo (container on 127.0.0.1:8502)

location = /syncraft {
    return 301 /syncraft/;
}

location = /syncraft/demo {
    return 301 /syncraft/demo/;
}

# Longer prefix than /syncraft/, so it wins for everything under /syncraft/demo/.
location /syncraft/demo/ {
    proxy_pass http://127.0.0.1:8502;
    include /srv/infra/generated/nginx/snippets/websocket.conf;
}

location ^~ /syncraft/ {
    alias /srv/apps/syncraft/src/site/;
    index index.html;
}
